# Spotify Quantumult X rules
# QX response script hosted at Auto-001/QX---.
# 创建时间2026年11月13日，融合app2smile/devchristian1337脚本适配9.1.98+版本
# 作者Auto-001
# 电报@SOLO灵魂
# 本脚本仅供学习交流，请在24小时内删除

hostname = spclient.wg.spotify.com, *spclient.spotify.com

# Remove conditional-cache headers so patched configuration is fetched again.
^https:\/\/(spclient\.wg\.spotify\.com|.*-spclient\.spotify\.com(:443)?)\/user-customization-service\/v1\/customize$ url script-request-header https://raw.githubusercontent.com/app2smile/rules/master/js/spotify-qx-header.js
^https:\/\/(?:spclient\.wg|[\w-]+-spclient)\.spotify\.com(?::443)?\/(?:remote-config-resolver\/v\d+\/configuration|nebula\/v\d+\/configuration\/attributes)(?:\?[^#]*)?$ url script-request-header https://raw.githubusercontent.com/app2smile/rules/master/js/spotify-qx-header.js

# Legacy responses plus app 9.1.98+ remote configuration and account attributes.
^https:\/\/(spclient\.wg\.spotify\.com|.*-spclient\.spotify\.com(:443)?)\/(?:bootstrap\/v1\/bootstrap|user-customization-service\/v1\/customize)(?:\?.*)?$ url script-response-body https://raw.githubusercontent.com/Auto-001/QX---/refs/heads/main/spotify-qx.js
^https:\/\/(?:spclient\.wg|[\w-]+-spclient)\.spotify\.com(?::443)?\/(?:remote-config-resolver\/v\d+\/configuration|nebula\/v\d+\/configuration\/attributes)(?:\?[^#]*)?$ url script-response-body https://raw.githubusercontent.com/Auto-001/QX---/refs/heads/main/spotify-qx.js

# Existing app2smile artist and album display fix.
^https:\/\/(spclient\.wg\.spotify\.com|.*-spclient\.spotify\.com(:443)?)\/(artistview\/v1\/artist|album-entity-view\/v2\/album)\/ url script-request-header https://raw.githubusercontent.com/app2smile/rules/master/js/spotify-json.js
